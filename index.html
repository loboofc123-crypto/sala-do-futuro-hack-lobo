        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; align-items: center; }
        .section-box { background: rgba(10, 10, 25, 0.6); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 12px; padding: 30px; text-align: center; box-shadow: 0 0 20px rgba(0, 243, 255, 0.05); backdrop-filter: blur(5px); transition: all 0.3s ease; }

        .section-box.mobile-box { border-color: rgba(176, 38, 255, 0.3); }
        .section-box.mobile-box:hover { border-color: #b026ff; box-shadow: 0 0 25px rgba(176, 38, 255, 0.2); }
        h2 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin-bottom: 20px; color: #ffffff; }
        .btn { display: block; width: 100%; padding: 14px 20px; margin: 15px 0; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; text-decoration: none; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .btn-pc { background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(0, 100, 255, 0.3)); color: #00f3ff; border: 1px solid #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .btn-pc:hover { background: #00f3ff; color: #03030c; box-shadow: 0 0 20px #00f3ff; }
        .btn-mobile { background: linear-gradient(135deg, rgba(176, 38, 255, 0.2), rgba(100, 0, 255, 0.3)); color: #d882ff; border: 1px solid #b026ff; box-shadow: 0 0 10px rgba(176, 38, 255, 0.2); }
        .btn-mobile:hover { background: #b026ff; color: #ffffff; box-shadow: 0 0 20px #b026ff; }
        footer { text-align: center; padding: 20px; font-size: 0.9rem; color: rgba(0, 243, 255, 0.5); border-top: 1px solid rgba(0, 243, 255, 0.1); background: rgba(3, 3, 12, 0.9); }
